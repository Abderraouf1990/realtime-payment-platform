# Opt-in local collection; combine with docker-compose.yml from the repository root.
services:
  transaction-processor:
    environment:
      SPRING_PROFILES_ACTIVE: observability
      PROCESSOR_ADDRESS: 0.0.0.0
    ports:
      - '127.0.0.1:${PROCESSOR_METRICS_PORT:-8081}:8081'

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    user: '65534:65534'
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --storage.tsdb.retention.size=64MB
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
    read_only: true
    tmpfs:
      - /prometheus:uid=65534,gid=65534,mode=0700
      - /tmp:uid=65534,gid=65534,mode=0700
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks:
      payments: {}
      monitoring:
        # Keep the published UI reachable when the exercise disconnects scraping.
        gw_priority: 1

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    user: '472:472'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_LOG_MODE: console
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    read_only: true
    tmpfs:
      - /var/lib/grafana:uid=472,gid=472,mode=0700
      - /tmp:uid=472,gid=472,mode=0700
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [monitoring]

networks:
  monitoring:
    driver: bridge
