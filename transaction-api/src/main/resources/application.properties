spring.application.name=transaction-api
# W3C context is transport metadata, independent of business correlationId.
spring.kafka.template.observation-enabled=true
management.tracing.propagation.type=W3C
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
# Export is opt-in; tracing and log correlation work without a collector.
management.tracing.export.zipkin.enabled=${TRACING_EXPORT_ENABLED:false}
management.tracing.export.zipkin.endpoint=${TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=3000
spring.kafka.producer.properties[delivery.timeout.ms]=5000
payments.kafka.received-topic=transactions.received
payments.kafka.publish-timeout=10s
