spring.application.name=transaction-processor
# Each delivery gets its own consumer span, including manual replay.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.tracing.propagation.type=W3C
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.tracing.export.zipkin.enabled=${TRACING_EXPORT_ENABLED:false}
management.tracing.export.zipkin.endpoint=${TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
server.port=${PROCESSOR_PORT:8081}
server.address=${PROCESSOR_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,metrics
logging.structured.format.console=logstash
spring.main.banner-mode=off
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,kafkaListener
management.endpoint.health.group.listener.include=kafkaListener
management.endpoint.health.group.listener.show-details=always
management.endpoint.health.group.listener.show-components=always
# Health reads local lifecycle state only: no blocking database/broker probes.
management.health.db.enabled=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payments}
spring.datasource.username=${POSTGRES_USER:payments}
spring.datasource.password=${POSTGRES_PASSWORD:payments_dev_only}
payments.kafka.received-topic=${TRANSACTIONS_RECEIVED_TOPIC:transactions.received}
payments.kafka.rejected-topic=${TRANSACTIONS_REJECTED_TOPIC:transactions.rejected}
payments.kafka.publish-timeout=10s
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=3000
spring.kafka.producer.properties[delivery.timeout.ms]=5000
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:transaction-processor-local}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.aayadi.payment.contracts.v1.TransactionReceived
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.aayadi.payment.contracts.v1
spring.kafka.consumer.properties[allow.auto.create.topics]=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=true
spring.jpa.hibernate.ddl-auto=validate
