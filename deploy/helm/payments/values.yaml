# Application images are the independently verified M2 publication.
api:
  image: ghcr.io/abderraouf1990/realtime-payment-platform-transaction-api@sha256:07a331642be5ea3f0c75d7c60de355fd36439814fc2d36837cffe192e9279992
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
processor:
  # Enable only with an M4 image built from source; the published M2 digest has no HTTP health.
  healthProbes:
    enabled: false
  image: ghcr.io/abderraouf1990/realtime-payment-platform-transaction-processor@sha256:7999d5611fd1452ceeef66dd64c8fb381b281a2cf854596993d4b92404e3d8db
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: "1", memory: 1Gi}
kafka:
  image: apache/kafka:4.1.1
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1536Mi}
database:
  image: postgres:17.6
  # Created separately; must contain database, username and password keys.
  existingSecret: payments-db
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
# Uses the cluster's default StorageClass (kind: local-path).
storageClass: ""
# Changes only application pod templates; used for the controlled rollout exercise.
rolloutMarker: baseline
