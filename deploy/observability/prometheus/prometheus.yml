global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: payment-processor
    metrics_path: /actuator/prometheus
    scrape_timeout: 3s
    scrape_protocols: [PrometheusText0.0.4]
    static_configs:
      - targets: ['transaction-processor:8081']
    # Defense in depth: the application registry already exports an exact allowlist.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'payments_(consumer_(lag|observation_available|observation_age_seconds|progress_age_seconds|listener_running)|processing_attempts_total)'
        action: keep
      - regex: '__name__|job|instance|outcome'
        action: labelkeep
